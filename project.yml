# Dự án Xcode của AutoCut Camera (iPhone) — tạo bằng XcodeGen trên máy Mac:
#   brew install xcodegen && cd ios && xcodegen
# (xem ios/README.md)
name: AutoCutCamera
options:
  bundleIdPrefix: vn.autocut
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  AutoCutCamera:
    type: application
    platform: iOS
    sources:
      - path: AutoCutCamera
        excludes:
          - "www/**"
          - "Info.plist"
      # Giao diện web (camera, WebRTC, quét QR) — thư mục giữ nguyên cấu trúc trong app
      - path: AutoCutCamera/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AutoCutCamera
        PRODUCT_BUNDLE_IDENTIFIER: vn.autocut.camera
        INFOPLIST_FILE: AutoCutCamera/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Điền Team ID của tài khoản Apple Developer (hoặc chọn Team trong Xcode → Signing & Capabilities)
        DEVELOPMENT_TEAM: ""
