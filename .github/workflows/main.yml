name: Build app iPhone

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Chọn Xcode mới nhất
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo dự án Xcode
        run: xcodegen

      - name: Build (không ký — Sideloadly ký khi cài)
        run: |
          xcodebuild -project AutoCutCamera.xcodeproj -target AutoCutCamera \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AutoCutCamera.app Payload/
          zip -qry AutoCut-Camera.ipa Payload
          ls -lh AutoCut-Camera.ipa

      - name: Tải lên kết quả
        uses: actions/upload-artifact@v4
        with:
          name: AutoCut-Camera-ipa
          path: AutoCut-Camera.ipa
          retention-days: 30
