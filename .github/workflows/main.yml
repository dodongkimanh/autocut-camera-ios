# Build app iPhone "AutoCut Camera" trên máy Mac ảo của GitHub (không cần máy Mac).
# Kết quả: file AutoCut-Camera.ipa CHƯA KÝ → cài lên iPhone bằng Sideloadly (Windows) với Apple ID của bạn.
# Chạy: tab Actions → "Build app iPhone" → Run workflow (hoặc tự chạy mỗi khi tải file mới lên).
name: Build app iPhone

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # Dự án có thể nằm ở gốc kho hoặc trong một thư mục con (khi kéo thả cả thư mục lên GitHub)
      - name: Tìm thư mục dự án
        run: |
          P=$(find . -name project.yml -not -path "./.git/*" | head -1)
          if [ -z "$P" ]; then
            echo "::error::Chưa thấy file project.yml trong kho — hãy tải các file dự án lên (tab Code → Add file → Upload files)."
            find . -not -path "./.git/*" | head -50
            exit 1
          fi
          echo "Dự án ở: $(dirname "$P")"
          echo "APP_DIR=$(dirname "$P")" >> "$GITHUB_ENV"

      - name: Chọn Xcode mới nhất
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo dự án Xcode
        working-directory: ${{ env.APP_DIR }}
        run: xcodegen

      - name: Build (không ký — Sideloadly ký khi cài)
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodebuild -project AutoCutCamera.xcodeproj -target AutoCutCamera \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Đóng gói .ipa
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AutoCutCamera.app Payload/
          zip -qry "$GITHUB_WORKSPACE/AutoCut-Camera.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/AutoCut-Camera.ipa"

      - name: Tải lên kết quả
        uses: actions/upload-artifact@v4
        with:
          name: AutoCut-Camera-ipa
          path: AutoCut-Camera.ipa
          retention-days: 30
